<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College വിധി</title><style>*{box-sizing:border-box}body{margin:0;background:#181126;color:#221825;font:17px system-ui}.wrap{width:min(1050px,calc(100% - 28px));margin:auto;padding:30px 0 55px}.top{display:flex;justify-content:space-between;color:#fff5e6}.top a{color:#f4ca6d;text-decoration:none}.brand{font:22px Georgia;color:#f4ca6d}.paper{margin-top:25px;padding:clamp(25px,5vw,50px);background:#fff9e9;border:1px solid #d7a755;border-radius:22px;box-shadow:0 20px 60px #0008}.tag{font:11px monospace;letter-spacing:.12em;color:#a14c28}h1{font:clamp(34px,6vw,62px)/1 Georgia;color:#713129;margin:12px 0}.oracle{padding:20px;background:#30233f;color:#fff7e6;border-radius:15px;line-height:1.65;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{min-height:190px;padding:21px;border-radius:16px;color:#fff;animation:pulse 1.4s infinite}.card small{font:11px monospace;letter-spacing:.1em}.card h2{font-size:22px;margin:10px 0}.card p{line-height:1.55}.red{background:#922d33;animation-duration:.7s}.green{background:#266541;animation-duration:1.8s}.amber{background:#99691f}.purple{background:#513670}@keyframes pulse{50%{filter:brightness(1.32)}}.again{display:inline-block;margin-top:28px;padding:13px 18px;background:#8d392e;color:#fff;text-decoration:none;border-radius:9px;font-weight:bold}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style><main class="wrap"><header class="top"><div class="brand">☾ College Jathakam</div><a href="college.html">← വീണ്ടും search ചെയ്യാം</a></header><section class="paper"><div class="tag">100% RANDOM COLLEGE COSMIC REPORT</div><h1 id="name"></h1><div class="oracle" id="oracle"></div><div class="grid" id="grid"></div><a class="again" href="college.html">വേറെ കോളേജിന്റെ വിധി നോക്കാം ↻</a></section></main><script>
