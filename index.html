</style><main class="wrap"><div class="brand">☾ KTU Jathakam</div><section class="hero"><div class="copy"><div style="font-size:12px;letter-spacing:.12em;color:#a14c29">SUPPLY UNDO · STUDENT DETAILS</div><h1>KTU Jathakam <span>നിന്റെ academic ഗ്രഹനില നോക്കാം</span></h1><p class="lead">Register number, semester, branch, supply count കൊടുത്താൽ subject-ന്റെ യഥാർത്ഥ cosmic roast കിട്ടും.</p><form class="form" action="result.html"><input name="roll" required placeholder="Register number (TVE22CS001)"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><select name="semester"><option>S1</option><option>S2</option><option>S3</option><option>S4</option><option>S5</option><option>S6</option><option>S7</option><option>S8</option></select><select name="branch"><option>CSE</option><option>ECE</option><option>Mechanical</option><option>Civil</option><option>EEE</option></select></div><select id="supply" name="supply"><option value="0">0 supply — safe-ish</option><option value="1">1 supply</option><option value="2">2 supplies</option><option value="3">3 supplies</option><option value="4">4 supplies</option><option value="5">5 supplies</option><option value="6">6 supplies</option><option value="7">7 supplies</option><option value="8">8 supplies</option><option value="9">9 supplies</option><option value="10">10+ supplies — academic apocalypse</option></select><input id="subject" name="subject" class="hidden" placeholder="Failed subject (only if supply)"><button>ജാതകം നോക്കാം ✦</button></form><a class="link" href="college.html">🏫 College Jathakam നോക്കണോ? →</a><a class="link" href="features.html">🔥 KTU Survival Features →</a></div><div class="portrait"><img src="assets/poojari.png" alt="Poojari"></div></section></main><script>const s=document.querySelector('#supply'),subject=document.querySelector('#subject');s.onchange=()=>subject.classList.toggle('hidden',s.value==='0');</script>
